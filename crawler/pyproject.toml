[project]
name = "labb-web-search-crawler"
version = "0.1.0"
description = "Web pages as Markdown for AI to read, and web search that reads the results: a service for labb"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Random Encabulator" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "playwright>=1.55",
    "trafilatura>=2.0",
    "markdownify>=0.14",
    "pypdf>=5.0",
    "ddgs>=9.0",
    "psycopg[binary]>=3.3.6",
    "feedparser>=6.0",
    "charset-normalizer>=3.0",
]

[project.scripts]
labb-web-search-crawler = "labb_web_search_crawler.app:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labb_web_search_crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
