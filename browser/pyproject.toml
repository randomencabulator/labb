[project]
name = "labb-browser"
version = "0.1.0"
description = "A browser a model can use: pages as numbered controls, clicking, filling in forms, and a live view to take over"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Random Encabulator" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "playwright>=1.55",
]

[project.scripts]
labb-browser = "labb_browser.app:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labb_browser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
