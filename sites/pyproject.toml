[project]
name = "labb-sites"
version = "0.1.0"
description = "Takes static websites as zip or tar archives and swaps each in at once, for Caddy to serve at /<name>/"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Random Encabulator" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
labb-sites = "labb_sites.app:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labb_sites"]

[tool.pytest.ini_options]
testpaths = ["tests"]
