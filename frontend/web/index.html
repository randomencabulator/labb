<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Labb</title>
    <!-- Added to a phone's home screen, it opens as an app of its own (no browser bars) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Labb" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The status bar takes the page's background; theme.ts follows a theme picked in the app -->
    <meta name="theme-color" content="#fffdf3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
