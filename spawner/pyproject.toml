[project]
name = "labb-spawner"
version = "0.1.0"
description = "Starts and stops labb's apps, each a Docker container of its own, on ports labb knows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Random Encabulator" }]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46",
    "docker>=7.1",
    "dulwich>=0.24",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.32",
]

[project.scripts]
labb-spawner = "labb_spawner.app:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labb_spawner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
