# A release, from a tag that matches pyproject.toml's version (v0.33.0 for 0.33.0):
#   git tag v0.33.0 && git push origin v0.33.0
# It pushes labb's images to GHCR (ghcr.io/randomencabulator/<image>:0.33.0, :0.33 and :latest, the
# names compose.yaml pulls), then makes a GitHub release with labb-server.tar.gz (compose.yaml pinned to
# this version, setup.sh, .env.example and the files compose.yaml mounts) and the labb wheel.
# With the repository variable PUBLISH_PYPI=true it also publishes the wheel to PyPI, with trusted
# publishing (PyPI → the project → Publishing: this repository, workflow release.yml, environment pypi).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The same as the images in compose.yaml
  IMAGE_PREFIX: ghcr.io/randomencabulator

jobs:
  version:
    name: Tag matches the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but pyproject.toml's version is $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  images:
    name: ${{ matrix.image }}
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: labb-web, context: . }
          - { image: labb-web-search-crawler, context: crawler }
          - { image: labb-browser, context: browser }
          - { image: labb-sandbox, context: sandbox }
          - { image: labb-spawner, context: spawner }
          - { image: labb-sites-front, context: sites/front }
          - { image: labb-sites, context: sites }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          # 0.33.0, 0.33, and latest (not for a pre-release like v0.34.0-rc.1)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  wheel:
    name: labb wheel
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --wheel --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  release:
    name: GitHub release
    needs: [version, images, wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: labb-server.tar.gz
        run: |
          mkdir -p bundle/labb
          cp -r compose.yaml setup.sh .env.example LICENSE caddy backup bundle/labb/
          # Without LABB_VERSION in .env, this release's images
          sed -i "s/\${LABB_VERSION:-latest}/\${LABB_VERSION:-$VERSION}/" bundle/labb/compose.yaml
          if grep -q 'LABB_VERSION:-latest' bundle/labb/compose.yaml; then
            echo "::error::compose.yaml still has an image at latest"; exit 1
          fi
          tar -C bundle -czf dist/labb-server.tar.gz labb
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "labb $VERSION" $prerelease dist/*

  pypi:
    name: PyPI
    needs: release
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
